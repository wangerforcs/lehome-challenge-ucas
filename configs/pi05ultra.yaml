dataset:
  repo_id: top_long_pant_short
  root: /data/datasets/datasets-hf/dataset_challenge_merged/top_long_pant_short_merged

policy:
  type: pi05
  device: cuda
  push_to_hub: false
  pretrained_path: /home/wzb/challenges/lehome-challenge/outputs/train/pi05_filterd/checkpoints/010000/pretrained_model
  chunk_size: 50
  n_action_steps: 10
  dtype: bfloat16
  optimizer_lr: 4e-5
  scheduler_decay_lr: 2e-5
  scheduler_warmup_steps: 3000
  scheduler_decay_steps: 30000
  gradient_checkpointing: true

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/pi05_ultra2
batch_size: 64
steps: 30000
save_freq: 3000
log_freq: 500

wandb:
  enable: true
  project: pi05_folder