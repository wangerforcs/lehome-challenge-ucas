dataset:
  repo_id: topshort
  root: /data/datasets/datasets-hf/top_short_large/top_short_merged

policy:
  type: pi05
  device: cuda
  push_to_hub: false
  pretrained_path: /home/wzb/challenges/lehome-challenge/outputs/train/top_short_pi05_final/checkpoints/005000/pretrained_model
  chunk_size: 20
  n_action_steps: 10
  dtype: bfloat16
  optimizer_lr: 4e-5
  scheduler_decay_lr: 2e-5
  scheduler_warmup_steps: 5000 
  scheduler_decay_steps: 30000
  gradient_checkpointing: true
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/top_short_pi05_final1
batch_size: 64
steps: 30000
save_freq: 5000
log_freq: 500

wandb:
  enable: true
  project: pi05_top_short